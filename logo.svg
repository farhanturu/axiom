<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="axiomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield icon -->
  <g transform="translate(10, 15)">
    <!-- Shield shape -->
    <path d="M45 10 L45 45 C45 65 25 80 25 80 C25 80 5 65 5 45 L5 10 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner shield -->
    <path d="M45 20 L45 42 C45 55 25 65 25 65 C25 65 5 55 5 42 L5 20 Z" 
          fill="url(#shieldGrad)" opacity="0.2"/>
    
    <!-- Eye icon (security scanning) -->
    <ellipse cx="25" cy="38" rx="15" ry="10" fill="none" stroke="url(#shieldGrad)" stroke-width="2"/>
    <circle cx="25" cy="38" r="5" fill="url(#shieldGrad)"/>
    
    <!-- Scan lines -->
    <line x1="10" y1="30" x2="40" y2="30" stroke="url(#shieldGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="46" x2="40" y2="46" stroke="url(#shieldGrad)" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Text "AXIOM" -->
  <text x="75" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800" fill="url(#axiomGrad)" letter-spacing="2">AXIOM</text>
  
  <!-- Subtitle -->
  <text x="75" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="3">SECURITY BYPASS FRAMEWORK</text>
  
  <!-- Decorative line -->
  <line x1="75" y1="90" x2="350" y2="90" stroke="url(#axiomGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Version badge -->
  <rect x="75" y="98" width="60" height="18" rx="9" fill="url(#axiomGrad)" opacity="0.9"/>
  <text x="105" y="111" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">v2.0.0</text>
</svg>
