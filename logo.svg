<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#0f172a" stroke="url(#grad2)" stroke-width="2"/>
  
  <!-- Eye outer shape -->
  <ellipse cx="60" cy="60" rx="35" ry="22" fill="none" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Eye inner shape -->
  <ellipse cx="60" cy="60" rx="25" ry="15" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Iris -->
  <circle cx="60" cy="60" r="12" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Pupil -->
  <circle cx="60" cy="60" r="6" fill="url(#grad1)"/>
  
  <!-- Center dot -->
  <circle cx="60" cy="60" r="2" fill="white"/>
  
  <!-- Scan line -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
  
  <!-- Corner accents -->
  <path d="M15 15 L25 15 L25 25" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <path d="M105 15 L95 15 L95 25" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <path d="M15 105 L25 105 L25 95" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <path d="M105 105 L95 105 L95 95" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Pulse rings -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.1"/>
</svg>
